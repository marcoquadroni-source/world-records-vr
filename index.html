<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Records Experience</title><style>body{margin:0;background:#101827;color:white;font:16px system-ui}#panel{position:absolute;z-index:5;top:12px;left:12px;max-width:340px;background:#101827e8;padding:16px;border-radius:16px}button,select{padding:10px;margin:4px;border:0;border-radius:8px;font:inherit}canvas{display:block}small{display:block;color:#cbd5e1}</style></head><body><div id="panel"><h2>World Records Experience</h2><select id="exhibit"><option value="people">Mänskliga rekord</option><option value="whale">Blåval – 30 meter</option></select><p id="info">Robert Wadlow 272 cm · Chandra Dangi 54,6 cm · Referens 180 cm</p><button id="vr">Starta VR</button><button id="ar">Starta Mixed Reality</button><small id="status">Dra för att rotera vyn. I headsetet: tryck avtryckaren för att växla utställning.</small></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new T.Scene(), camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.01,150), renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');document.body.append(renderer.domElement);camera.position.set(0,1.65,3);camera.lookAt(0,1.3,-2);scene.add(new T.HemisphereLight(0xffffff,0x596070,2.5));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(3,7,4);scene.add(sun);const world=new T.Group();scene.add(world);const floor=new T.GridHelper(80,80,0x8096a8,0x334155);scene.add(floor);scene.background=new T.Color(0x172538);
function mesh(g,c,p,x,y,z,sx=1,sy=1,sz=1){const m=new T.Mesh(g,new T.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.scale.set(sx,sy,sz);p.add(m);return m}const sphere=new T.SphereGeometry(1,32,20);function ball(p,c,x,y,z,a,b,d){return mesh(sphere,c,p,x,y,z,a,b,d)}function limb(p,c,a,b,r){const v=new T.Vector3(...b).sub(new T.Vector3(...a));const m=mesh(new T.CapsuleGeometry(r,Math.max(0,v.length()-2*r),8,16),c,p,...new T.Vector3(...a).addScaledVector(v,.5).toArray());m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());return m}
function label(p,text,x,y,z){const c=document.createElement('canvas');c.width=1024;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='#142438';ctx.fillRect(0,0,1024,256);ctx.fillStyle='white';ctx.font='bold 55px sans-serif';ctx.textAlign='center';text.split('|').forEach((s,i)=>ctx.fillText(s,512,90+i*75));const m=new T.Mesh(new T.PlaneGeometry(1.15,.2875),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide}));m.position.set(x,y,z);p.add(m)}
function person(name,h,x,coat,slim=1){const p=new T.Group();p.position.set(x,0,-2.7);p.scale.setScalar(h);world.add(p);const skin=0xc69a78, trousers=0x303744;ball(p,skin,0,.937,0,.057,.063,.052);ball(p,coat,0,.70,0,.112*slim,.17,.065);ball(p,trousers,0,.51,0,.09*slim,.08,.06);for(const s of [-1,1]){limb(p,trousers,[s*.045,.51,0],[s*.045,.06,0],.037);ball(p,0x222222,s*.045,.032,.025,.045,.032,.078);limb(p,coat,[s*.10,.80,0],[s*.15,.57,0],.028);limb(p,skin,[s*.15,.57,0],[s*.15,.48,0],.023);ball(p,0x302820,s*.022,.95,.046,.006,.004,.006)}ball(p,skin,0,.93,.051,.012,.013,.012);label(world,name+'|'+(h*100).toLocaleString('sv-SE')+' cm',x,.17,-2.1)}
let mode='people';function build(){while(world.children.length)world.remove(world.children[0]);if(mode==='people'){person('Robert Wadlow',2.72,-1.25,0x43536a,.83);person('Referensperson',1.8,0,0x467e78);person('Chandra Dangi',.546,1.15,0x9b5a3c,1.15)}else{const p=new T.Group();p.position.set(0,3,-8);world.add(p);ball(p,0x527c96,-2,0,0,11,2.4,2.5);ball(p,0x527c96,9,0,0,4,1.05,1.05);for(const s of [-1,1]){const f=ball(p,0x527c96,13.8,0,s*1.5,1.2,.25,2.4);f.rotation.y=s*.4;const fl=ball(p,0x527c96,-3,-1,s*2.5,2,.25,2);fl.rotation.y=s*.5;ball(p,0x18252d,-10,.3,s*1.65,.15,.15,.15)}label(world,'Blåval|30 m – illustration',0,1.2,-3)}}build();function change(){mode=document.querySelector('#exhibit').value;build();document.querySelector('#info').textContent=mode==='people'?'Robert Wadlow 272 cm · Chandra Dangi 54,6 cm · Referens 180 cm':'Blåval – illustrativ modell, cirka 30 meter.'}document.querySelector('#exhibit').onchange=change;function toggle(){document.querySelector('#exhibit').value=mode==='people'?'whale':'people';change()}
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);c.addEventListener('select',toggle);scene.add(c)}const status=document.querySelector('#status');async function start(kind){try{if(!navigator.xr)throw Error('WebXR saknas. Öppna via HTTPS i Meta Quest Browser.');if(!await navigator.xr.isSessionSupported(kind))throw Error('Detta XR-läge stöds inte här.');const session=await navigator.xr.requestSession(kind,{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});scene.background=kind==='immersive-ar'?null:new T.Color(0x172538);floor.visible=kind!=='immersive-ar';await renderer.xr.setSession(session);document.querySelector('#panel').style.display='none';session.addEventListener('end',()=>{document.querySelector('#panel').style.display='block';scene.background=new T.Color(0x172538);floor.visible=true})}catch(e){status.textContent=e.message}}document.querySelector('#vr').onclick=()=>start('immersive-vr');document.querySelector('#ar').onclick=()=>start('immersive-ar');let drag=false,last=0,angle=0;renderer.domElement.onpointerdown=e=>{drag=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag&&!renderer.xr.isPresenting){angle+=(e.clientX-last)*.008;last=e.clientX;camera.position.set(Math.sin(angle)*5,1.65,-2+Math.cos(angle)*5);camera.lookAt(0,1.2,-2)}};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
