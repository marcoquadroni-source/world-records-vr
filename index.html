const select=document.querySelector('#exhibit');select.innerHTML='';const groups=['Människor','Djur','Byggnader och natur','Fordon och teknik','Förhistoriska djur','Rymden'];const bounds=[0,6,14,20,28,33,37];groups.forEach((g,i)=>{const o=document.createElement('optgroup');o.label=g;for(let j=bounds[i];j<bounds[i+1];j++){const a=document.createElement('option');a.value=j;a.textContent=records[j][0];o.append(a)}select.append(o)});
let mode=0;const box=(p,c,x,y,z,a,b,d)=>mesh(new T.BoxGeometry(1,1,1),c,p,x,y,z,a,b,d);const cone=(p,c,x,y,z,r,h)=>mesh(new T.ConeGeometry(r,h,24),c,p,x,y,z);const cyl=(p,c,x,y,z,r,h)=>mesh(new T.CylinderGeometry(r,r,h,24),c,p,x,y,z);

for(let i=0;i<2;i++){const c=renderer.xr.getController(i);c.addEventListener('select',toggle);scene.add(c)}const status=document.querySelector('#status');async function start(kind){try{if(!navigator.xr)throw Error('WebXR saknas. Öppna via HTTPS i Meta Quest Browser.');if(!await navigator.xr.isSessionSupported(kind))throw Error('Detta XR-läge stöds inte här.');const session=await navigator.xr.requestSession(kind,{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});scene.background=kind==='immersive-ar'?null:new T.Color(0x172538);floor.visible=kind!=='immersive-ar';await renderer.xr.setSession(session);document.querySelector('#panel').style.display='none';session.addEventListener('end',()=>{document.querySelector('#panel').style.display='block';scene.background=new T.Color(0x172538);floor.visible=true})}catch(e){status.textContent=e.message}}document.querySelector('#vr').onclick=()=>start('immersive-vr');document.querySelector('#ar').onclick=()=>start('immersive-ar');let drag=false,last=0,angle=0;renderer.domElement.onpointerdown=e=>{drag=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag&&!renderer.xr.isPresenting){angle+=(e.clientX-last)*.008;last=e.clientX;camera.position.set(Math.sin(angle)*5,1.65,-2+Math.cos(angle)*5);camera.lookAt(0,1.2,-2)}};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>renderer.render(scene,camera));
